name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Pipeline policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Test CI policy scripts
        run: node --test .github/scripts/dependency-review.test.mjs

      - name: Validate repository scripts
        run: |
          for script in .github/scripts/*.mjs pages/scripts/*.mjs; do
            node --check "$script"
          done
          for script in .github/scripts/*.sh scripts/deployment/*.sh; do
            bash -n "$script"
          done

  supply_chain:
    name: Supply chain
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pages
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          DEPENDENCY_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCY_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../.github/scripts/dependency-review.mjs

      - name: Audit dependencies
        timeout-minutes: 16
        run: bash ../.github/scripts/npm-audit-retry.sh

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: pages/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Lint
    needs: supply_chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0

  tests:
    name: Tests and coverage
    needs: supply_chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test with full coverage
        run: |
          npm run test:ci -- --runInBand \
            --collectCoverageFrom='src/**/*.{js,jsx}' \
            --collectCoverageFrom='!src/index.jsx' \
            --collectCoverageFrom='!src/setupTests.js' \
            --collectCoverageFrom='!src/**/*.test.{js,jsx}' \
            --collectCoverageFrom='!src/**/*.spec.{js,jsx}' \
            --coverageThreshold='{"global":{"branches":60,"functions":80,"lines":80,"statements":80}}' \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageReporters=json-summary

      - name: Upload coverage report
        if: ${{ always() && !cancelled() && hashFiles('pages/coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: pages/coverage/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and package
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build and write deployment metadata
        run: node ../.github/scripts/verify-build.mjs build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-build-${{ github.sha }}
          path: pages/build/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI
    if: ${{ always() }}
    needs: [policy, supply_chain, lint, tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce required pipeline stages
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply_chain.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          {
            echo "## CI pipeline"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Pipeline policy | $POLICY_RESULT |"
            echo "| Supply chain | $SUPPLY_CHAIN_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Tests and coverage | $TESTS_RESULT |"
            echo "| Build and package | $BUILD_RESULT |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$POLICY_RESULT" != "success" ||
                "$SUPPLY_CHAIN_RESULT" != "success" ||
                "$LINT_RESULT" != "success" ||
                "$TESTS_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ]]; then
            echo "Result: Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more required CI stages did not complete successfully." >&2
            exit 1
          fi

          echo "Result: Passed" >> "$GITHUB_STEP_SUMMARY"
