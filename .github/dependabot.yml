version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/pages"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      vite-majors:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        update-types:
          - major
      babel-jest-majors:
        patterns:
          - "@babel/*"
          - "babel-jest"
          - "jest"
          - "jest-*"
        update-types:
          - major
      eslint-majors:
        patterns:
          - "eslint"
          - "eslint-*"
        update-types:
          - major
