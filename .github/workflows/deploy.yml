name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        working-directory: pages
        run: npm ci

      # The generated PDF is tracked so local, preview, and Pages builds all
      # publish the same bytes. This check also detects a stale PDF after the
      # LaTeX source changes.
      - name: Verify resume artifact
        working-directory: pages
        run: npm run verify:resume

      - name: Build site
        working-directory: pages
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
