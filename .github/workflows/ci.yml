name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pages
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Audit dependencies
        timeout-minutes: 10
        run: bash ../.github/scripts/npm-audit-retry.sh

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Test with full coverage
        run: |
          npm run test:ci -- --runInBand \
            --collectCoverageFrom='src/**/*.{js,jsx}' \
            --collectCoverageFrom='!src/index.jsx' \
            --collectCoverageFrom='!src/reportWebVitals.js' \
            --collectCoverageFrom='!src/setupTests.js' \
            --collectCoverageFrom='!src/**/*.test.{js,jsx}' \
            --collectCoverageFrom='!src/**/*.spec.{js,jsx}' \
            --coverageThreshold='{"global":{"branches":60,"functions":80,"lines":80,"statements":80}}' \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageReporters=json-summary

      - name: Build
        run: npm run build

      - name: Verify build and write deployment metadata
        run: node ../.github/scripts/verify-build.mjs build

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload coverage report
        if: ${{ always() && !cancelled() && hashFiles('pages/coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: pages/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        if: ${{ always() && !cancelled() && hashFiles('pages/build/deploy-meta.json') != '' && hashFiles('pages/build/SHA256SUMS') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-build-${{ github.sha }}
          path: pages/build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        if: ${{ always() && !cancelled() && hashFiles('pages/sbom.cdx.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: pages/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
